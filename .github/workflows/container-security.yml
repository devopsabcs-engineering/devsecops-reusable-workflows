name: Container Security Scanning

on:
  workflow_call:
    inputs:
      version:
        description: "Semantic version of the image"
        type: string

      container-file:
        description: "Path to the Dockerfile"
        type: string
        default: "Dockerfile"

      container-context:
        description: "Build's context is the set of files located in the specified PATH or URL"
        type: string
        default: "."

      container-name:
        description: "Name of the container"
        type: string
        default: "${{ github.repository }}"

      scanning-block:
        description: "Block the build if vulnerabilities are found"
        type: string
        default: "false"

env:
  REGISTRY: ghcr.io

jobs:
  scan-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build Initial Container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          file: "${{ inputs.container-file }}"
          context: "${{ inputs.container-context }}"
          load: true
          push: false
          tags: localbuild/testimage:latest

      # Scan the image for vulnerabilities
      - name: Run the Anchore / Grype scan action
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          image: localbuild/testimage:latest
          only-fixed: true
          fail-build: ${{ inputs.scanning-block }}

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: sarif
          path: ${{ steps.scan.outputs.sarif }}

      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
